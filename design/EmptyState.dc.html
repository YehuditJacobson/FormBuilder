<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg: oklch(0.99 0.004 255);
      --surface:#ffffff;
      --surface-2: oklch(0.976 0.004 255);
      --surface-3: oklch(0.955 0.005 255);
      --border: oklch(0.918 0.006 255);
      --border-strong: oklch(0.865 0.008 255);
      --text: oklch(0.29 0.02 260);
      --text-2: oklch(0.5 0.016 260);
      --text-3: oklch(0.63 0.012 260);
      --accent: oklch(0.55 0.12 245);
      --accent-hover: oklch(0.47 0.13 245);
      --accent-tint: oklch(0.965 0.03 245);
      --radius: 9px;
      --radius-sm: 6px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
      --font: "Assistant", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;direction:rtl;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
    h1,h2,p{margin:0;}
    .topbar{height:56px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:9px;padding:0 24px;font-size:13px;}
    .brand{font-weight:700;margin-left:6px;}
    .crumb--here{color:var(--text);font-weight:600;}
    .page{max-width:1120px;margin:0 auto;padding:28px 28px 60px;}
    .btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit;font-weight:600;font-size:13px;cursor:pointer;}
    .btn--primary{background:var(--accent);border-color:var(--accent);color:#fff;}
    .btn--primary:hover{background:var(--accent-hover);}
    .muted{color:var(--text-3);}
    .empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:64px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;}
    .empty__icon{width:52px;height:52px;border-radius:14px;background:var(--accent-tint);color:var(--accent-hover);display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
  </style>
</helmet>

<div class="topbar">
  <span class="brand">בונה טפסים</span>
  <span class="crumb--here">טפסים</span>
</div>

<div class="page">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px">
    <div>
      <h1 style="font-size:22px;font-weight:700">תבניות טפסים</h1>
      <p class="muted" style="font-size:13px;margin-top:4px">טפסים ארגוניים ומסלול האישורים שהוגדר לכל אחד מהם.</p>
    </div>
    <button class="btn btn--primary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      טופס חדש
    </button>
  </div>

  <div class="empty">
    <div class="empty__icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M12 12v6M9 15h6"/></svg>
    </div>
    <h2 style="font-size:17px;font-weight:700">עדיין אין תבניות טפסים</h2>
    <p class="muted" style="font-size:13.5px;margin-top:7px;max-width:400px">צרו את הטופס הארגוני הראשון, הוסיפו את השדות שלו, והגדירו את מסלול האישורים שהוא צריך לעבור.</p>
    <button class="btn btn--primary" style="margin-top:20px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      טופס חדש
    </button>
  </div>
</div>

</x-dc>
</body>
</html>
